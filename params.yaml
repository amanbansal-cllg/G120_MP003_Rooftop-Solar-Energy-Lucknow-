# Project settings. Read with yaml.safe_load (see src/solar_ml/config.py).
data:
  train: data/raw/train.csv
  later: data/raw/later.csv
  holdout: data/raw/holdout_features.csv
  cleaned_train: data/processed/train_clean.csv

columns:
  id: record_id
  date: date
  target: energy_kwh
  group: area
  numeric:
    - panel_area_m2
    - sunshine_hours
    - temp_c
    - dust_days
    - panel_age_yr
    - cloud_cover_pct
  categorical:
    - roof_type
    - area

data_checks:
  sentinel_candidates: [-1, -99, -999, 999, 9999]
  sentinel_min_count: 5
  unit_factors: [10, 12, 60, 100, 1000, 10000]
  unit_ratio_min: 5
  stuck_min_run_days: 7
  leak_corr_threshold: 0.95
  target_typo_factor: 10
  target_typo_gap_ratio: 2.0

reports:
  data_checks: reports/data_checks.json
  findings: reports/findings.yaml

# Stage 2: training v1 with MLflow (src/solar_ml/train.py)
mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: mp003-solar-energy
  registered_model_name: mp003-solar-energy
  champion_alias: champion

model:
  output_path: models/model.joblib
  val_size: 0.2          # share of cleaned train.csv held back to compare settings
  cv_folds: 5            # k-fold MAE on the 80% part, used to pick the best setting
  random_state: 42
  select_metric: cv_mae  # lower is better
  # Every setting below becomes one MLflow run. The best one is refit on
  # all of cleaned train.csv and registered as version 1 (v1, @champion).
  candidates:
    - name: ridge_a0.1
      type: ridge
      params: {alpha: 0.1}
    - name: ridge_a1
      type: ridge
      params: {alpha: 1.0}
    - name: ridge_a10
      type: ridge
      params: {alpha: 10.0}
    - name: random_forest
      type: random_forest
      params: {n_estimators: 300, max_depth: 10, min_samples_leaf: 2}
    - name: gradient_boosting
      type: gradient_boosting
      params: {n_estimators: 300, learning_rate: 0.05, max_depth: 3}
